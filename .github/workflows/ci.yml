name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Migrations and pytest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nei_ci
          POSTGRES_PASSWORD: nei_ci_password
          POSTGRES_DB: nigeria_economic_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nei_ci -d nigeria_economic_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_USER: nei_ci
      POSTGRES_PASSWORD: nei_ci_password
      POSTGRES_DB: nigeria_economic_ci
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[analysis,dev]"

      - name: Apply migrations
        run: python -m nigeria_economic_intelligence.migrate up

      - name: Report migration status
        run: python -m nigeria_economic_intelligence.migrate status

      # The CI database is empty: it has the schema but none of the
      # published observations, which are fetched from the World Bank and
      # HDX rather than committed. Tests marked `warehouse` assert on those
      # loaded values, so they are deselected here and run locally instead.
      # Everything that can be verified without them is verified here:
      # the migrations, the schema and its constraints, the validator, the
      # revision trigger, batch tracking, and every connector against
      # recorded fixtures.
      - name: Run the test suite
        run: python -m pytest -m "not warehouse" -v

  r:
    name: R connectivity
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nei_ci
          POSTGRES_PASSWORD: nei_ci_password
          POSTGRES_DB: nigeria_economic_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nei_ci -d nigeria_economic_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_USER: nei_ci
      POSTGRES_PASSWORD: nei_ci_password
      POSTGRES_DB: nigeria_economic_ci
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::DBI
            any::RPostgres

      - name: Check the R connection to the warehouse
        run: Rscript tests/test_r_postgres.R
